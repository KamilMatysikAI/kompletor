# Lokalny Postgres TYLKO dla repo logistyka (dev + testy). Hasła wyłącznie lokalne.
# Produkcja: zmienne w Coolify, nigdy w tym pliku.
#   npm run db:up    -> start bazy (port 55433, żeby nie kolidować z innymi projektami)
#   npm run db:down  -> zatrzymanie
name: logistyka
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: logistyka
      POSTGRES_PASSWORD: logistyka_local
      POSTGRES_DB: logistyka
    ports:
      - '127.0.0.1:55433:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U logistyka -d logistyka']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pg_data:
