# Tryb lekki: nakładka na compose.yaml dla małej firmy albo małego serwera (1–2 GB RAM).
#
#   docker compose -f compose.yaml -f compose.lekki.yaml up -d
#
# Co zmienia (wszystko odwracalne: start bez tej nakładki wraca do ustawień domyślnych, dane zostają w wolumenach):
#   db      Postgres z mniejszym buforem (shared_buffers 64 MB zamiast 128 MB), mniej połączeń (50 zamiast 100),
#           mniejsza pamięć na sortowania; limit kontenera 384 MB
#   web     sterta Node najwyżej 256 MB, limit kontenera 512 MB
#   worker  sterta Node najwyżej 256 MB, limit kontenera 512 MB
# Razem najwyżej ok. 1,4 GB, w praktyce ok. 0,3–0,5 GB (pomiar w docs/instalacja.md, „Wymagania sprzętowe”).
#
# Połączenia: pule są ograniczone w kodzie (web 3 + 5 na firmę, lib/db.ts; worker 3 + 3 na firmę, lib/worker/petla.ts),
# czyli 6 stałych + 8 na każdą firmę: 14 przy jednej firmie, 46 przy pięciu; 50 starcza na ok. 5 firm z zapasem na polecenia CLI.
#
# Kiedy NIE używać: więcej niż kilka firm na jednej instalacji, duże importy katalogu (dziesiątki tysięcy produktów) albo
# kod wyjścia 137 w `docker compose ps` (brak pamięci w limicie) — wtedy start bez nakładki albo większe limity
# we własnej kopii tego pliku. Budowanie obrazu (`docker compose build`) ta nakładka nie ogranicza.
services:
  db:
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=50
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - effective_cache_size=256MB
    deploy:
      resources:
        limits:
          memory: 384M

  web:
    environment:
      NODE_OPTIONS: --max-old-space-size=256
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    environment:
      NODE_OPTIONS: --max-old-space-size=256
    deploy:
      resources:
        limits:
          memory: 512M
